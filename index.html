<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرجع أكواد أعطال السيارات | OBD-II Code Reference</title>
    <meta name="description" content="مرجع شامل لأكواد أعطال السيارات OBD-II - أكثر من 300 كود مع الأسباب والحلول. كوري، ألماني، أمريكي، صيني، ياباني.">
    <meta name="keywords" content="أكواد أعطال السيارات, OBD-II, P0420, P0300, فحص السيارة, أعطال المحرك">
    <meta name="author" content="أبو عساف">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #06060f;
            --bg-secondary: #0c0c1d;
            --bg-card: #111128;
            --glass-bg: rgba(15, 15, 40, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-muted: #7a7a9a;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --gradient-hero: linear-gradient(135deg, #0c0c1d 0%, #0a0a2e 30%, #060620 60%, #0d0d1f 100%);
            --gradient-card: linear-gradient(160deg, rgba(20, 20, 55, 0.7) 0%, rgba(10, 10, 30, 0.8) 100%);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --radius-xl: 20px;
            --radius-lg: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .bg-universe {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: var(--gradient-hero);
        }
        .bg-universe::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(139,92,246,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 80%, rgba(6,182,212,0.04) 0%, transparent 50%);
            animation: bgPulse 15s infinite;
        }
        @keyframes bgPulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.2;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }
        .main-container { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 20px 24px 40px; }

        .header { text-align: center; padding: 40px 20px 20px; }
        .header-icon { font-size: 55px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-15px); } }
        .header h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; background: linear-gradient(135deg, #e8e8f0, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: var(--text-secondary); }
        .badge-row { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .badge-country {
            padding: 8px 18px; border-radius: 50px; font-size: 0.85rem; font-weight: 600;
            background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-secondary);
            cursor: pointer; transition: var(--transition); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 6px;
        }
        .badge-country:hover, .badge-country.active { background: rgba(59,130,246,0.2); border-color: #3b82f6; color: #fff; }
        .flag-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-kr { background: #cd2e3a; } .dot-de { background: #ffcc00; } .dot-us { background: #3b82f6; } .dot-cn { background: #ef4444; } .dot-jp { background: #fff; border:2px solid #ccc; }

        .search-section { max-width: 700px; margin: 30px auto; }
        .search-wrapper {
            display: flex; align-items: center; background: var(--glass-bg); border: 1.5px solid var(--glass-border);
            border-radius: 60px; padding: 6px; backdrop-filter: blur(20px); box-shadow: var(--shadow-lg);
        }
        .search-icon { margin: 0 14px; color: var(--text-muted); }
        .search-input {
            flex:1; background: transparent; border: none; color: #fff; font-size: 1rem; padding: 14px 8px;
            outline: none; font-family: 'Tajawal', sans-serif;
        }
        .search-clear { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: none; }
        .search-clear.visible { display: flex; align-items: center; justify-content: center; }
        .results-count { text-align: center; color: var(--text-muted); margin-top: 12px; }

        .filter-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-tab {
            padding: 10px 18px; border-radius: 50px; font-weight: 600; font-size: 0.9rem; font-family: 'Tajawal', sans-serif;
            background: var(--glass-bg); border: 1.5px solid var(--glass-border); color: var(--text-secondary);
            cursor: pointer; transition: var(--transition); backdrop-filter: blur(10px);
        }
        .filter-tab.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }

        .codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; padding-bottom: 40px; }
        .code-card {
            background: var(--gradient-card); border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
            padding: 20px; cursor: pointer; transition: var(--transition); position: relative; overflow: hidden;
            box-shadow: var(--shadow-card); backdrop-filter: blur(8px);
        }
        .code-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); }
        .code-card.expanded { border-color: var(--accent-blue); box-shadow: 0 0 30px rgba(59,130,246,0.3); }
        .code-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .code-badge {
            padding: 5px 14px; border-radius: 50px; font-weight: 800; font-family: monospace;
            background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3);
        }
        .code-country-tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.04); color: var(--text-muted); }
        .code-desc { font-weight: 600; margin-bottom: 8px; }
        .code-causes {
            font-size: 0.9rem; color: var(--text-muted); line-height: 1.6;
            max-height: 3.6em; overflow: hidden; transition: max-height 0.4s ease;
        }
        .code-card.expanded .code-causes { max-height: 500px; }
        .code-causes-label { color: var(--accent-amber); font-weight: 600; }
        .expand-hint { font-size: 0.75rem; color: var(--accent-cyan); margin-top: 8px; opacity: 0.7; transition: opacity 0.3s; }
        .code-card.expanded .expand-hint { opacity: 0; }
        .copy-btn {
            position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); cursor: pointer; width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem;
            z-index: 5; display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .copy-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .site-footer {
            text-align: center; padding: 30px; border-top: 1px solid var(--glass-border); background: rgba(6,6,15,0.7);
            backdrop-filter: blur(10px); margin-top: 20px; border-radius: 20px 20px 0 0;
        }
        .footer-social { display: flex; justify-content: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
        .social-icon-link {
            display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 50px; text-decoration: none;
            color: #fff; font-weight: 600; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
        }
        .visitor-counter {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            padding: 10px 20px; border-radius: 50px; margin-top: 12px;
        }
        .scroll-top {
            position: fixed; bottom: 30px; right: 30px; z-index: 99; width: 46px; height: 46px; border-radius: 50%;
            background: var(--accent-blue); border: none; color: #fff; font-size: 1.3rem; cursor: pointer; opacity: 0;
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
        }
        .scroll-top.visible { opacity: 1; pointer-events: auto; }
        @media (max-width: 768px) {
            .codes-grid { grid-template-columns: 1fr; }
            .filter-tab { padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="bg-universe"></div>
<div class="bg-grid"></div>

<div class="main-container">
    <header class="header">
        <div class="header-icon">🔧</div>
        <h1>مرجع أكواد أعطال السيارات</h1>
        <p class="subtitle">OBD-II Diagnostic Trouble Codes Database</p>
        <div class="badge-row">
            <span class="badge-country" data-country="كوري"><span class="flag-dot dot-kr"></span> كوري 🇰🇷</span>
            <span class="badge-country" data-country="ألماني"><span class="flag-dot dot-de"></span> ألماني 🇩🇪</span>
            <span class="badge-country" data-country="أمريكي"><span class="flag-dot dot-us"></span> أمريكي 🇺🇸</span>
            <span class="badge-country" data-country="صيني"><span class="flag-dot dot-cn"></span> صيني 🇨🇳</span>
            <span class="badge-country" data-country="ياباني"><span class="flag-dot dot-jp"></span> ياباني 🇯🇵</span>
        </div>
    </header>

    <div class="search-section">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن كود عطل... مثال: P0420">
            <button class="search-clear" id="searchClear">✕</button>
        </div>
        <p class="results-count">عدد الأكواد: <span id="countSpan">0</span></p>
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">📋 الكل</button>
        <button class="filter-tab" data-filter="كوري">🇰🇷 كوري</button>
        <button class="filter-tab" data-filter="ألماني">🇩🇪 ألماني</button>
        <button class="filter-tab" data-filter="أمريكي">🇺🇸 أمريكي</button>
        <button class="filter-tab" data-filter="صيني">🇨🇳 صيني</button>
        <button class="filter-tab" data-filter="ياباني">🇯🇵 ياباني</button>
    </div>

    <div class="codes-grid" id="codesGrid"></div>
</div>

<footer class="site-footer">
    <div class="footer-social">
        <a href="https://snapchat.com/add/sww_p" class="social-icon-link" target="_blank">👻 سناب sww_p</a>
        <a href="https://instagram.com/sww_p" class="social-icon-link" target="_blank">📸 انستا sww_p</a>
        <a href="https://twitter.com/sww_p" class="social-icon-link" target="_blank">🐦 تويتر sww_p</a>
        <a href="https://t.me/sww_p" class="social-icon-link" target="_blank">✈️ تلقرام sww_p</a>
    </div>
    <p>تم التطوير بواسطة <strong style="color:#f59e0b;">ابو عساف</strong></p>
    <div class="visitor-counter">
        <span style="color:#10b981;">●</span> عدد الزوار: <span id="visitorCount">10,000</span>
    </div>
</footer>

<button class="scroll-top" id="scrollTopBtn">↑</button>

<!-- ملف الأكواد الخارجي -->
<script src="codes-data.js"></script>

<script>
    (function() {
        // عداد الزوار
        let count = localStorage.getItem('obd_visitor_count');
        if (!count) count = 10000;
        else count = parseInt(count);
        count += Math.floor(Math.random() * 15) + 1;
        localStorage.setItem('obd_visitor_count', count);
        document.getElementById('visitorCount').textContent = count.toLocaleString('en-US');

        const grid = document.getElementById('codesGrid');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const countSpan = document.getElementById('countSpan');
        const scrollBtn = document.getElementById('scrollTopBtn');

        let currentFilter = 'all';
        let searchQuery = '';

        function render() {
            let codes = window.faultCodes || [];
            if (currentFilter !== 'all') codes = codes.filter(c => c.country === currentFilter || c.country === 'عام');
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                codes = codes.filter(c => c.code.toLowerCase().includes(q) || c.desc.includes(q) || c.causes.includes(q));
            }
            countSpan.textContent = codes.length;
            grid.innerHTML = '';

            if (codes.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:var(--text-muted);">😕 لا توجد نتائج</p>';
                return;
            }

            codes.forEach(item => {
                const card = document.createElement('div');
                card.className = 'code-card';
                card.innerHTML = `
                    <button class="copy-btn" data-code="${item.code}">📋</button>
                    <div class="code-header"><span class="code-badge">${item.code}</span><span class="code-country-tag">${item.country}</span></div>
                    <p class="code-desc">${item.desc}</p>
                    <p class="code-causes"><span class="code-causes-label">الأسباب:</span> ${item.causes}</p>
                    <p class="expand-hint">اضغط للتوسيع</p>
                `;
                card.onclick = function(e) {
                    if (e.target.closest('.copy-btn')) return;
                    this.classList.toggle('expanded');
                };
                grid.appendChild(card);
            });

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navigator.clipboard.writeText(this.dataset.code);
                    this.textContent = '✓';
                    setTimeout(() => { this.textContent = '📋'; }, 1200);
                });
            });
        }

        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value;
            searchClear.classList.toggle('visible', searchQuery.trim().length > 0);
            render();
        });
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            searchClear.classList.remove('visible');
            render();
        });

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                render();
            });
        });

        window.addEventListener('scroll', () => scrollBtn.classList.toggle('visible', window.scrollY > 600));
        scrollBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

        // انتظار تحميل البيانات
        if (window.faultCodes) render();
        else window.addEventListener('load', render);
    })();
</script>
</body>
</html>
